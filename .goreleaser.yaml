version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: dotcor
    main: ./cmd/dotcor
    binary: dotcor
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
  groups:
    - title: Features
      regexp: '^feat:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix:'
      order: 1
    - title: Others
      order: 999

# Homebrew formula is updated manually at ~/cs/homebrew-dotcor/Formula/dotcor.rb
# GoReleaser v2 brews section is deprecated and has breaking changes
# Manual update process:
#   1. Get SHA256 from release: https://github.com/justincordova/dotcor/releases
#   2. Update version and SHA256 in Formula/dotcor.rb
#   3. git commit -m "dotcor X.Y.Z" && git push
# Takes ~30 seconds per release

release:
  github:
    owner: justincordova
    name: dotcor
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
